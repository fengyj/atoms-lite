packages:
  - "apps/*"
  - "packages/*"

# pnpm 11：必须显式允许二进制包的安装脚本
allowBuilds:
  core-js-pure: false
  esbuild: true
  workerd: true
  sharp: true
  "@tailwindcss/oxide": true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.149'
  - '@ai-sdk/mcp@2.0.101'
  - '@ai-sdk/openai-compatible@3.0.93'
  - '@ai-sdk/provider-utils@5.0.82'
  - '@ai-sdk/provider@4.0.39'
  - '@ai-sdk/react@4.0.180'
  - '@cloudflare/workers-types@5.20261118.1'
  - ai@7.0.176
  - miniflare@5.20261117.0-beta
  - wrangler@4.164.0

